<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人物朝向修改前後｜Grace & Dennis</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f7fa;color:#234454;font:15px/1.75 system-ui,'Microsoft JhengHei',sans-serif}main{max-width:1320px;margin:auto;padding:25px 18px 65px}h1{font-size:28px;margin:12px 0}h2{font-size:21px;margin:0 0 5px}a{color:#237b9f}.intro,#status{color:#5d7583;font-size:14px}.card{margin:25px 0;padding:22px;border:1px solid #d9e7ee;background:white;border-radius:16px}.triptych{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}figure{margin:0}figcaption{text-align:center;font-size:14px;margin:12px 0 10px}.image{display:block;border:0;padding:0;background:#fffcf7;width:100%;cursor:zoom-in}.image img{display:block;width:100%;height:auto;aspect-ratio:7/12;object-fit:contain}.pending{aspect-ratio:7/12;background:#f3f6f7;display:grid;place-items:center;color:#6b7f88}.note{font-size:14px;background:#f5f9fb;border-radius:10px;padding:12px 14px;margin-top:15px}.original-link{font-size:12px}dialog{width:min(96vw,700px);max-height:96dvh;border:0;border-radius:14px;padding:15px;background:#fffdf9}dialog img{display:block;width:100%;height:auto;max-height:82dvh;object-fit:contain}dialog button{float:right;min-height:42px;padding:6px 15px;background:white;border:1px solid #d9e7ee;border-radius:8px}dialog::backdrop{background:#163747bb}@media(max-width:600px){main{padding:20px 10px}h1{font-size:24px}.card{padding:12px}.triptych{gap:7px}figcaption{font-size:11px}.note{font-size:12px}.intro{font-size:13px}}
</style></head><body><main><a href="https://github.com/BrooksTalent/DennisSo/tree/main/tarot-direction-review-20261113">GitHub 檔案</a><h1>人物朝向修改前後</h1><p class="intro">三欄依次為 RWS 原版、修改前水彩版、修改後水彩版。全部以正位展示，點圖片可放大。</p><p id="status" role="status">讀取修改清單中。</p><section id="cards"></section><p class="intro">已選定31張牌，已按截圖意見更新其中7張（第二次修訂）。原版採用1909年 Rider–Waite–Smith 公開掃描。<a href="https://github.com/mixvlad/TarotCards/blob/main/tarot/rider-waite/metadata.json">原版掃描來源</a></p></main><dialog id="zoom"><button type="button" id="close">關閉</button><img id="large" alt=""></dialog><script>
const host=document.getElementById('cards');
function picture(src,alt){const button=document.createElement('button');button.type='button';button.className='image';button.setAttribute('aria-label','放大'+alt);const image=document.createElement('img');image.src=src;image.alt=alt;image.width=700;image.height=1200;image.loading='lazy';button.append(image);button.onclick=()=>{const large=document.getElementById('large');large.src=src;large.alt=alt;document.getElementById('zoom').showModal();};return button;}
document.getElementById('close').onclick=()=>document.getElementById('zoom').close();
const observer=new IntersectionObserver(entries=>{for(const entry of entries){if(!entry.isIntersecting)continue;const article=entry.target;observer.unobserve(article);loadImages(article);}},{rootMargin:'700px'});
async function loadImages(article){try{const response=await fetch('cards/'+article.dataset.id+'.json?v=feedback7-r2');if(!response.ok)throw Error('image');const images=await response.json();for(const figure of article.querySelectorAll('figure')){const caption=figure.querySelector('figcaption').textContent;figure.querySelector('.pending').replaceWith(picture(images[figure.dataset.key],article.dataset.name+' · '+caption));}}catch{for(const pending of article.querySelectorAll('.pending'))pending.textContent='圖片載入失敗，請重新整理。';}}
Promise.resolve({"cards":[{"id":"major_00","name":"愚者"},{"id":"major_08","name":"力量"},{"id":"major_17","name":"星星"},{"id":"major_21","name":"世界"},{"id":"wands_02","name":"權杖二"},{"id":"wands_09","name":"權杖九"},{"id":"wands_12","name":"權杖騎士"},{"id":"wands_14","name":"權杖國王"},{"id":"cups_06","name":"聖杯六"},{"id":"cups_11","name":"聖杯侍者"},{"id":"cups_13","name":"聖杯王后"},{"id":"swords_04","name":"寶劍四"},{"id":"swords_07","name":"寶劍七"},{"id":"swords_11","name":"寶劍侍者"},{"id":"swords_12","name":"寶劍騎士"},{"id":"pentacles_07","name":"錢幣七"},{"id":"pentacles_13","name":"錢幣王后"},{"id":"major_03","name":"皇后"},{"id":"major_07","name":"戰車"},{"id":"major_14","name":"節制"},{"id":"major_19","name":"太陽"},{"id":"cups_09","name":"聖杯九"},{"id":"swords_02","name":"寶劍二"},{"id":"swords_08","name":"寶劍八"},{"id":"pentacles_02","name":"錢幣二"},{"id":"pentacles_04","name":"錢幣四"},{"id":"pentacles_09","name":"錢幣九"},{"id":"wands_10","name":"權杖十"},{"id":"cups_05","name":"聖杯五"},{"id":"swords_06","name":"寶劍六"},{"id":"swords_10","name":"寶劍十"}]}).then(data=>{document.getElementById('status').textContent='已完成 '+data.cards.length+' / '+data.cards.length+' 張';for(const card of data.cards){const article=document.createElement('article');article.className='card';article.dataset.id=card.id;article.dataset.name=card.name;const title=document.createElement('h2');title.textContent=card.name;const triptych=document.createElement('div');triptych.className='triptych';for(const [caption,key] of [['RWS 原版','reference'],['修改前水彩版','before'],['修改後水彩版','after']]){const figure=document.createElement('figure');figure.dataset.key=key;const label=document.createElement('figcaption');label.textContent=caption;const pending=document.createElement('div');pending.className='pending';pending.textContent='載入圖片中';figure.append(label,pending);triptych.append(figure);}article.append(title,triptych);host.append(article);observer.observe(article);}}).catch(()=>{document.getElementById('status').textContent='清單載入失敗，請重新整理。';});
</script></body></html>
